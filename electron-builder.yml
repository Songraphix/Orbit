appId: com.songraphix.orbit
productName: Orbit
directories:
  buildResources: resources
  output: release/${version}
files:
  - out/**/*
  - package.json
asarUnpack:
  - '**/*.node'
mac:
  category: public.app-category.productivity
  icon: resources/icon.icns
  darkModeSupport: true
  minimumSystemVersion: '13.0'
  target:
    - target: dmg
      arch: arm64
  # Unsigned for personal use (M1–M2). Signing + notarisation: PLAN.md section 12.
  identity: null
  # Voice (push-to-talk): macOS shows this when Orbit first asks for the microphone.
  extendInfo:
    NSMicrophoneUsageDescription: Orbit listens only while you use voice (⇧⌘Space or the microphone in the command bar) and turns what you say into text on this Mac. Websites you allow can use it too.
# Lets Orbit be chosen as the default browser (links from other apps open in Little Orbit).
protocols:
  - name: Web Page
    schemes:
      - http
      - https
# HTML files open in Orbit too (macOS lists it as a browser).
fileAssociations:
  - ext: [html, htm, xhtml, shtml]
    name: HTML Document
    role: Viewer
  # PDFs open in Orbit's PDF viewer too (Open With → Orbit); Orbit isn't made the default.
  - ext: [pdf]
    name: PDF Document
    role: Viewer
    rank: Alternate
# Electron Fuses (PLAN.md sections 4.8 and 12), flipped in the packaged binary:
# - no ELECTRON_RUN_AS_NODE, NODE_OPTIONS or --inspect: the app can't be turned into a Node shell
# - the app is loaded only from app.asar, whose integrity is checked
# - cookies are encrypted with the Keychain
# File-protocol privileges stay on: Orbit's own pages are served from file://.
electronFuses:
  runAsNode: false
  enableCookieEncryption: true
  enableNodeOptionsEnvironmentVariable: false
  enableNodeCliInspectArguments: false
  enableEmbeddedAsarIntegrityValidation: true
  onlyLoadAppFromAsar: true
  loadBrowserProcessSpecificV8Snapshot: false
  grantFileProtocolExtraPrivileges: true
  # Flipping fuses changes the binary; Apple Silicon kills an app whose ad-hoc signature no longer
  # matches, so it's re-signed (ad hoc) afterwards.
  resetAdHocDarwinSignature: true
